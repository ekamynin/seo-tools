<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Technical Audit</title>
<style>
:root {
  color-scheme: light dark;
  font: 15px system-ui, sans-serif;
  --surface: light-dark(#fff, #1b2123);
  --muted-surface: light-dark(#f3f7f6, #232c2d);
  --line: light-dark(#d6e2df, #354345);
  --ink: light-dark(#182522, #eaf2f0);
  --muted: light-dark(#4e6260, #aebfbc);
  --accent: light-dark(#14624d, #99efd2);
  --accent-bg: light-dark(#e0f4ec, #23453b);
  --issue: light-dark(#a23535, #ffc1bd);
  --issue-bg: light-dark(#fceae8, #482f30);
  --important: light-dark(#775115, #f6d28e);
  --important-bg: light-dark(#fff1d7, #423824);
}
* { box-sizing: border-box; }
body { margin: 0; padding: 0 1px 12px; color: var(--ink); background: transparent; }
button, input, select, textarea { font: inherit; }
button, input, select, textarea { border: 1px solid var(--line); border-radius: 9px; }
button, summary, select { cursor: pointer; }
button, input, select, textarea { min-height: 40px; padding: .55rem .78rem; }
input, textarea, select, button { background: var(--surface); color: var(--ink); }
button:hover, summary:hover { border-color: var(--accent); }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
label { display: grid; gap: .4rem; min-width: 0; color: var(--muted); font-size: .85rem; font-weight: 650; }
.overview {
  padding: clamp(16px, 3vw, 28px);
  background: linear-gradient(125deg, var(--accent-bg), var(--surface) 68%);
  border: 1px solid var(--line);
  border-radius: 18px;
}
.overview-head { display: grid; grid-template-columns: minmax(0, 1.1fr) minmax(0, 1fr); gap: 1.2rem 2rem; align-items: end; }
.progress-label { display: block; margin-bottom: .3rem; color: var(--muted); font-size: .85rem; font-weight: 650; }
#progress-text { display: block; font-size: clamp(1.08rem, 2.6vw, 1.65rem); line-height: 1.3; font-variant-numeric: tabular-nums; }
progress { display: block; width: 100%; height: 8px; margin-top: .65rem; accent-color: var(--accent); border: 0; border-radius: 8px; overflow: hidden; background: var(--line); }
progress::-webkit-progress-bar { background: var(--line); }
progress::-webkit-progress-value { background: var(--accent); }
progress::-moz-progress-bar { background: var(--accent); }
.stats { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: .6rem; margin: 1.15rem 0 0; }
.stat { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: .65rem .85rem; }
.stat dt { color: var(--muted); font-size: .8rem; line-height: 1.3; }
.stat dd { margin: .2rem 0 0; font-size: 1.35rem; font-weight: 740; font-variant-numeric: tabular-nums; }
.stat .ok { color: var(--accent); }
.stat .issue { color: var(--issue); }
#controls { margin: 1rem 0 .85rem; display: grid; gap: .6rem; }
.controls-row { display: flex; align-items: end; flex-wrap: wrap; gap: .9rem 1.4rem; }
.controls { display: grid; grid-template-columns: minmax(0, 1.35fr) minmax(0, 1fr); flex: 1 1 320px; gap: .6rem; }
select { width: 100%; }
.toolbar, .statuses { display: flex; flex-wrap: wrap; align-items: center; gap: .4rem; }
.toolbar button, .statuses button { font-size: .85rem; font-weight: 650; }
#copy { color: var(--accent); background: var(--accent-bg); border-color: transparent; }
#copy:hover { border-color: var(--accent); }
#reset, .note-toggle { color: var(--muted); background: transparent; }
#feedback { margin: .65rem 0; }
#feedback:empty { margin: 0; }
small { color: var(--muted); line-height: 1.45; }
details { margin-block: .65rem; border: 1px solid var(--line); border-radius: 13px; background: var(--surface); }
summary { display: flex; align-items: center; gap: .65rem; padding: .85rem 1rem; border: 1px solid transparent; border-radius: 12px; font-weight: 680; list-style: none; }
summary::-webkit-details-marker { display: none; }
summary::before { content: ""; flex: 0 0 7px; height: 7px; border-right: 2px solid var(--accent); border-bottom: 2px solid var(--accent); transform: rotate(-45deg); margin-inline-end: .15rem; }
details[open] summary::before { transform: rotate(45deg); }
details[open] summary { background: var(--muted-surface); border-radius: 12px 12px 0 0; }
.section-count { margin-inline-start: auto; padding: .2rem .55rem; border-radius: 999px; background: var(--accent-bg); color: var(--accent); font-size: .8rem; white-space: nowrap; font-variant-numeric: tabular-nums; }
.check { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, auto); align-items: start; gap: .45rem 1.2rem; padding: 1rem; border-top: 1px solid var(--line); }
.check h3 { font-size: 1rem; margin: 0 0 .28rem; line-height: 1.45; font-weight: 670; }
.check p { margin: 0; line-height: 1.5; color: var(--muted); font-size: .9rem; }
.badge { display: inline-block; vertical-align: middle; font-size: .68rem; font-weight: 700; padding: .13rem .45rem; margin-inline-start: .45rem; border-radius: 999px; background: var(--muted-surface); color: var(--muted); white-space: nowrap; }
.badge.critical { background: var(--issue-bg); color: var(--issue); }
.badge.important { background: var(--important-bg); color: var(--important); }
.statuses button { min-height: 36px; padding: .4rem .6rem; }
.statuses button[aria-pressed=true] { color: var(--accent); background: var(--accent-bg); border-color: var(--accent); }
.statuses button[data-status=issue][aria-pressed=true] { color: var(--issue); background: var(--issue-bg); border-color: var(--issue); }
.statuses button[data-status=na][aria-pressed=true] { color: var(--ink); background: var(--muted-surface); border-color: var(--muted); }
.notes { grid-column: 1 / -1; margin-top: .2rem; }
textarea { width: 100%; resize: vertical; }
dialog { max-width: min(94vw, 44rem); width: 100%; padding: 1.25rem; border: 1px solid var(--line); border-radius: 14px; background: var(--surface); color: var(--ink); }
dialog::backdrop { background: #09161380; }
dialog form { margin-top: .75rem; }
#empty { padding: 1rem; border: 1px dashed var(--line); border-radius: 12px; color: var(--muted); }
[hidden] { display: none !important; }
@media (max-width: 860px) {
  .check { grid-template-columns: 1fr; }
}
@media (max-width: 520px) {
  .overview-head { grid-template-columns: 1fr; }
  .stats { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .controls { grid-template-columns: 1fr; }
  summary, .check { padding-inline: .75rem; }
}
</style>
</head>
<body>
<section class="overview" aria-label="Прогрес та результати">
  <div class="overview-head">
    <label>Сайт, який перевіряєте
      <input id="project" type="text" placeholder="example.com" maxlength="250" autocomplete="off">
    </label>
    <div>
      <span class="progress-label">Прогрес аудиту</span>
      <strong id="progress-text"></strong>
      <progress id="progress" aria-label="Прогрес аудиту"></progress>
    </div>
  </div>
  <dl class="stats">
    <div class="stat"><dt>Гаразд</dt><dd class="ok" id="count-ok"></dd></div>
    <div class="stat"><dt>Проблеми</dt><dd class="issue" id="count-issue"></dd></div>
    <div class="stat"><dt>Не стосується</dt><dd id="count-na"></dd></div>
    <div class="stat"><dt>Залишилося</dt><dd id="count-pending"></dd></div>
  </dl>
  <span id="stats-text" hidden></span>
</section>
<div id="controls">
  <div class="controls-row">
    <div class="controls">
      <label>Розділ
        <select id="section-picker"><option value="">Усі розділи</option></select>
      </label>
      <label>Фільтр
        <select id="filter">
          <option value="all">Усі</option>
          <option value="pending">Не перевірено</option>
          <option value="issue">Проблеми</option>
          <option value="critical">Критичні</option>
        </select>
      </label>
    </div>
    <div class="toolbar">
      <button id="copy">Копіювати звіт</button>
      <button id="csv">Завантажити CSV</button>
      <button id="print">Друк / PDF</button>
      <button id="reset">Скинути</button>
    </div>
  </div>
  <small id="storage-hint">Прогрес і нотатки автоматично зберігаються в цьому браузері.</small>
</div>
<p id="feedback" role="status"></p>
<main id="checklist" aria-label="Чекліст аудиту"></main>
<p id="empty" hidden>Немає перевірок за вибраними фільтрами.</p>
<dialog id="copy-dialog">
  <label>Звіт
    <textarea id="report-text" rows="12" readonly></textarea>
  </label>
  <form method="dialog"><button>Закрити</button></form>
</dialog>
<dialog id="reset-dialog">
  <p>Скинути назву сайту, статуси та нотатки?</p>
  <form method="dialog" class="toolbar">
    <button value="cancel" autofocus>Скасувати</button>
    <button id="confirm-reset" value="reset">Скинути аудит</button>
  </form>
</dialog>
<script type="application/json" id="checklist-data">{{CHECKLIST_DATA}}</script>
<script>
const byId = id => document.getElementById(id);
const sections = JSON.parse(byId("checklist-data").textContent);
const storageKey = "seo-tools:technical-audit:v1";
const storageError = "Автозбереження недоступне. Експортуйте результати перед закриттям сторінки.";
const labels = {ok: "Гаразд", issue: "Проблема", na: "Не стосується", pending: "Не перевірено"};
const priorities = {critical: "Критично", important: "Важливо", recommended: "Бажано"};
const order = Object.keys(priorities);
const checks = sections.flatMap(section => section.checks.map((check, index) =>
  Object.assign(check, {id: section.id + "-" + (index + 1), section: section.title})));
const newAudit = () => ({project: "", results: {}});
let audit = newAudit();
try {
  const stored = JSON.parse(localStorage.getItem(storageKey));
  if (stored && typeof stored.project === "string" && stored.results && typeof stored.results === "object") {
    audit = stored;
  }
} catch {
  byId("storage-hint").textContent = storageError;
}

function save() {
  try {
    localStorage.setItem(storageKey, JSON.stringify(audit));
  } catch {
    byId("storage-hint").textContent = storageError;
  }
}

function element(tag, content, className) {
  const node = document.createElement(tag);
  if (content) node.textContent = content;
  if (className) node.className = className;
  return node;
}

function result(check) {
  return audit.results[check.id] ?? {status: "pending", note: ""};
}

function updateResult(check, next) {
  if (next.status === "pending" && !next.note) delete audit.results[check.id];
  else audit.results[check.id] = next;
  save();
}

const project = byId("project");
project.value = audit.project;
project.addEventListener("input", () => {
  audit.project = project.value;
  save();
});

const picker = byId("section-picker");
const filter = byId("filter");
const checklist = byId("checklist");
for (const section of sections) {
  picker.add(new Option(section.title, section.id));
  const details = element("details");
  details.open = section === sections[0];
  const summary = element("summary", section.title);
  section.counter = element("span", "", "section-count");
  summary.append(section.counter);
  details.append(summary);
  section.view = details;
  checklist.append(details);

  for (const check of section.checks) {
    const card = element("article", "", "check");
    const copy = element("div");
    const title = element("h3", check.title);
    title.append(element("span", priorities[check.priority], "badge " + check.priority));
    const statuses = element("div", "", "statuses");
    statuses.setAttribute("role", "group");
    statuses.setAttribute("aria-label", check.title);
    check.buttons = {};
    for (const status of ["ok", "issue", "na"]) {
      const button = element("button", labels[status]);
      button.type = "button";
      button.dataset.status = status;
      button.addEventListener("click", () => {
        const previous = result(check);
        updateResult(check, {...previous, status: previous.status === status ? "pending" : status});
        refresh();
      });
      check.buttons[status] = button;
      statuses.append(button);
    }
    const toggle = element("button", "Додати нотатку", "note-toggle");
    toggle.type = "button";
    statuses.append(toggle);
    const noteLabel = element("label", "Нотатка", "notes");
    noteLabel.hidden = true;
    noteLabel.id = "note-" + check.id;
    toggle.setAttribute("aria-controls", noteLabel.id);
    toggle.setAttribute("aria-expanded", "false");
    const note = element("textarea");
    note.rows = 3;
    note.maxLength = 1200;
    note.placeholder = "Додайте URL, факти та наступний крок…";
    note.value = result(check).note;
    noteLabel.append(note);
    toggle.addEventListener("click", () => {
      noteLabel.hidden = !noteLabel.hidden;
      toggle.setAttribute("aria-expanded", String(!noteLabel.hidden));
      if (!noteLabel.hidden) note.focus();
    });
    note.addEventListener("input", () => {
      updateResult(check, {...result(check), note: note.value});
      toggle.textContent = note.value ? "Редагувати нотатку" : "Додати нотатку";
    });
    copy.append(title, element("p", check.description));
    card.append(copy, statuses, noteLabel);
    details.append(card);
    Object.assign(check, {view: card, note, noteLabel, toggle});
  }
}

function refresh() {
  const counts = {ok: 0, issue: 0, na: 0, pending: 0};
  let anyVisible = false;
  for (const section of sections) {
    let completed = 0;
    let sectionVisible = false;
    for (const check of section.checks) {
      const {status, note} = result(check);
      counts[status] += 1;
      if (status !== "pending") completed += 1;
      for (const [value, button] of Object.entries(check.buttons)) {
        button.setAttribute("aria-pressed", String(value === status));
      }
      check.toggle.textContent = note ? "Редагувати нотатку" : "Додати нотатку";
      const matches = filter.value === "all" || filter.value === status ||
        (filter.value === "critical" && check.priority === "critical");
      check.view.hidden = !matches;
      sectionVisible ||= matches;
    }
    section.counter.textContent = completed + " / " + section.checks.length;
    section.view.hidden = !sectionVisible || Boolean(picker.value && picker.value !== section.id);
    anyVisible ||= !section.view.hidden;
  }
  for (const [status, count] of Object.entries(counts)) byId("count-" + status).textContent = count;
  const done = checks.length - counts.pending;
  byId("progress-text").textContent = done + " із " + checks.length + " перевірено (" +
    Math.round(done / checks.length * 100) + "%)";
  byId("stats-text").textContent = "Гаразд " + counts.ok + " · Проблеми " + counts.issue +
    " · Не стосується " + counts.na + " · Залишилося " + counts.pending;
  const progress = byId("progress");
  progress.max = checks.length;
  progress.value = done;
  byId("empty").hidden = anyVisible;
}

filter.addEventListener("change", () => {
  refresh();
  if (filter.value !== "all") {
    for (const section of sections) {
      if (!section.view.hidden) section.view.open = true;
    }
  }
});
picker.addEventListener("change", () => {
  const selected = sections.find(section => section.id === picker.value);
  if (selected) selected.view.open = true;
  refresh();
});
refresh();

const prioritized = [...checks].sort((a, b) => order.indexOf(a.priority) - order.indexOf(b.priority));
function report() {
  const issues = prioritized.filter(check => result(check).status === "issue");
  const lines = ["Технічний SEO-аудит", "Сайт: " + (audit.project.trim() || "не вказано"),
    byId("progress-text").textContent, byId("stats-text").textContent, ""];
  if (!issues.length) lines.push("Зафіксованих проблем немає.");
  for (const [index, check] of issues.entries()) {
    lines.push((index + 1) + ". [" + priorities[check.priority] + "] " + check.title,
      check.section, check.description);
    if (result(check).note) lines.push("Нотатка: " + result(check).note);
    lines.push("");
  }
  return lines.join("\n");
}

byId("copy").addEventListener("click", async () => {
  const text = report();
  try {
    await navigator.clipboard.writeText(text);
    byId("feedback").textContent = "Звіт скопійовано.";
  } catch {
    const field = byId("report-text");
    field.value = text;
    byId("copy-dialog").showModal();
    field.select();
  }
});

function csvCell(value) {
  const text = String(value);
  const safe = /^[\s\uFEFF]*[=+\-@]|^[\t\r\n]/.test(text) ? "'" + text : text;
  return '"' + safe.replaceAll('"', '""') + '"';
}

byId("csv").addEventListener("click", () => {
  const rows = [["Сайт", "Розділ", "Перевірка", "Опис", "Пріоритет", "Статус", "Нотатка"]];
  for (const check of prioritized) {
    const {status, note} = result(check);
    rows.push([audit.project, check.section, check.title, check.description,
      priorities[check.priority], labels[status], note]);
  }
  const csv = rows.map(row => row.map(csvCell).join(",")).join("\r\n");
  const url = URL.createObjectURL(new Blob(["\uFEFF", csv], {type: "text/csv;charset=utf-8"}));
  const link = element("a");
  link.href = url;
  link.download = "seo-audit.csv";
  document.body.append(link);
  link.click();
  link.remove();
  setTimeout(() => URL.revokeObjectURL(url), 1000);
});

byId("print").addEventListener("click", () => {
  const printWindow = window.open("", "_blank");
  if (!printWindow) {
    byId("feedback").textContent = "Дозвольте спливні вікна, щоб відкрити звіт для друку.";
    return;
  }
  printWindow.opener = null;
  printWindow.document.title = "Звіт технічного SEO-аудиту";
  const printable = printWindow.document.createElement("pre");
  printable.style.cssText = "white-space:pre-wrap;overflow-wrap:anywhere;font:11pt/1.5 system-ui,sans-serif";
  printable.textContent = report();
  printWindow.document.body.append(printable);
  printWindow.focus();
  printWindow.print();
});

byId("reset").addEventListener("click", () => byId("reset-dialog").showModal());
byId("confirm-reset").addEventListener("click", () => {
  audit = newAudit();
  save();
  project.value = "";
  filter.value = "all";
  picker.value = "";
  for (const check of checks) {
    check.note.value = "";
    check.noteLabel.hidden = true;
    check.toggle.setAttribute("aria-expanded", "false");
  }
  refresh();
  byId("feedback").textContent = "Аудит скинуто.";
});
</script>
</body>
</html>
